<div class="login-container">
  <div class="row justify-content-center w-100">
    <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
      <div class="card shadow-lg">
        <!-- Header -->
        <div class="card-header bg-primary text-white text-center py-4">
          <h3 class="mb-0">
            <i class="bi bi-book-fill"></i> Biblioteca
          </h3>
          <p class="mb-0 mt-2">Iniciar Sesión</p>
        </div>

        <!-- Body -->
        <div class="card-body p-4 p-md-5">
          <!-- Alerta de error -->
          <div class="alert alert-danger" *ngIf="error">
            <i class="bi bi-exclamation-triangle"></i> {{ error }}
          </div>

          <!-- Formulario -->
          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <!-- Campo Email -->
            <div class="mb-4">
              <label for="email" class="form-label">
                <i class="bi bi-envelope"></i> Email
              </label>
              <input 
                type="email" 
                class="form-control form-control-lg"
                [ngClass]="{'is-invalid': isFieldInvalid('email')}"
                id="email" 
                formControlName="email"
                placeholder="correo&#64;ejemplo.com"
                autocomplete="email">
              <div class="invalid-feedback" *ngIf="isFieldInvalid('email')">
                {{ getErrorMessage('email') }}
              </div>
            </div>

            <!-- Campo Contraseña -->
            <div class="mb-4">
              <label for="password" class="form-label">
                <i class="bi bi-lock"></i> Contraseña
              </label>
              <input 
                type="password" 
                class="form-control form-control-lg"
                [ngClass]="{'is-invalid': isFieldInvalid('password')}"
                id="password" 
                formControlName="password"
                placeholder="Mínimo 6 caracteres"
                autocomplete="current-password">
              <div class="invalid-feedback" *ngIf="isFieldInvalid('password')">
                {{ getErrorMessage('password') }}
              </div>
            </div>

            <!-- Botón de envío -->
            <div class="d-grid mb-4">
              <button 
                type="submit" 
                class="btn btn-primary btn-lg"
                [disabled]="loading">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                <i class="bi bi-box-arrow-in-right" *ngIf="!loading"></i>
                {{ loading ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
              </button>
            </div>
          </form>

          <!-- Divisor -->
          <hr class="my-4">

          <!-- Link a registro -->
          <div class="text-center mb-4">
            <p class="text-muted mb-0">
              ¿No tienes cuenta? 
              <a routerLink="/registro" class="text-primary fw-bold">Regístrate aquí</a>
            </p>
          </div>

          <!-- Credenciales de prueba -->
          <div class="alert alert-info mb-0">
            <div class="text-center">
              <strong><i class="bi bi-info-circle"></i> Credenciales de prueba</strong>
            </div>
            <hr class="my-2">
            <div class="row mt-3">
              <div class="col-12 mb-3">
                <div class="d-flex align-items-center">
                  <i class="bi bi-person-badge me-2"></i>
                  <div>
                    <small class="d-block"><strong>Admin:</strong></small>
                    <small class="text-muted">admin&#64;biblioteca.com / admin123</small>
                  </div>
                </div>
              </div>
              <div class="col-12">
                <div class="d-flex align-items-center">
                  <i class="bi bi-person me-2"></i>
                  <div>
                    <small class="d-block"><strong>Usuario:</strong></small>
                    <small class="text-muted">usuario&#64;biblioteca.com / admin123</small>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
