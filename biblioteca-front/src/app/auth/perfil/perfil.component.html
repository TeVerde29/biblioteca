<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0"><i class="bi bi-person-circle"></i> Mi Perfil</h4>
        </div>
        <div class="card-body">
          <div *ngIf="loading" class="text-center my-4">
            <div class="spinner-border text-primary"></div>
          </div>
          <div *ngIf="!loading">
            <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
            <ul class="list-group list-group-flush" *ngIf="usuario">
              <li class="list-group-item"><strong>Nombre:</strong> {{ usuario.nombre }}</li>
              <li class="list-group-item"><strong>Email:</strong> {{ usuario.email }}</li>
              <li class="list-group-item"><strong>Rol:</strong>
                <span class="badge" [ngClass]="usuario.rol === 'admin' ? 'bg-danger' : 'bg-info'">{{ usuario.rol }}</span>
              </li>
            </ul>
            <div class="mt-3" *ngIf="tokenValido !== null">
              <span class="badge" [ngClass]="tokenValido ? 'bg-success' : 'bg-danger'">
                Token {{ tokenValido ? 'válido' : 'inválido / expirado' }}
              </span>
            </div>
            <div class="d-flex gap-2 mt-4">
              <a routerLink="/libros" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
              <button class="btn btn-danger ms-auto" (click)="logout()"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
